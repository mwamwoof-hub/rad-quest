
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17365d">
<link rel="manifest" href="./manifest.json">
<title>RAD-QUEST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#243247;font-family: sans-serif}
header{background:#17365d;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:7px 0 0;font-size:13px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:9px;padding:13px;background:#17365d;color:white;font-size:15px;width:100%;margin:5px 0;cursor:pointer}
button.secondary{background:#e7edf5;color:#17365d}
button:disabled{opacity:.5}
.choice{background:#edf1f6;color:#243247;text-align:left}
.choice.selected{background:#d4e8f5;outline:2px solid #2877a8}
.small{font-size:13px;color:#64748b}
#result{line-height:1.7}
img.question-image{max-width:100%;height:auto;display:block;margin:12px auto}
</style>
</head>
<body>
<header>
<h1>RAD-QUEST</h1>
<p>診療放射線技師 国家試験対策</p>
</header>
<main>
<section id="home" class="card">
<h2>学習メニュー</h2>
<button onclick="startQuiz()">通常演習</button>
<button class="secondary" onclick="showYears()">年度別演習</button>
<button class="secondary" onclick="showReview()">間違い復習</button>
<button class="secondary" onclick="showFavorites()">お気に入り</button>
<button class="secondary" onclick="showStats()">学習成績</button>
<button class="secondary" onclick="startQuiz()">模擬試験（準備中・通常演習）</button>
<p class="small">※現在は動作確認用のサンプル問題を含みます。実際の国家試験問題はまだ収録されていません。</p>
</section>

<section id="screen" class="card" hidden></section>
</main>

<script src="./questions.js"></script>
<script>
const sampleQuestions=[{
id:"sample-001",year:2025,session:"サンプル",number:1,
field:"基礎医学",
question:"【動作確認用】人体で血液を全身に送り出す臓器はどれか。",
choices:["肺","肝臓","心臓","腎臓","胃"],
answer:2,
explanation:"心臓は血液を全身に送り出すポンプの役割を担います。",
image:null
}];

let questions=Array.isArray(window.RAD_QUEST)&&window.RAD_QUEST.length
?window.RAD_QUEST:sampleQuestions;
let currentQuestion=null;
let selected=-1;
let pool=[];
let position=0;
let mode="normal";

function read(key){
try{return JSON.parse(localStorage.getItem(key))||[]}
catch(e){return []}
}
function save(key,value){
try{localStorage.setItem(key,JSON.stringify(value))}
catch(e){}
}
function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function home(){
document.getElementById("home").hidden=false;
document.getElementById("screen").hidden=true;
}
function screen(html){
document.getElementById("home").hidden=true;
const s=document.getElementById("screen");
s.hidden=false;s.innerHTML=html;
}
function startQuiz(list=questions,type="normal"){
if(!list.length){screen("<h2>問題がありません</h2><button onclick='home()'>戻る</button>");return}
pool=list.slice();position=0;mode=type;showQuestion();
}
function startQuiz(){
startQuizWith(questions,"normal");
}
function startQuizWith(list,type){
if(!list.length){screen("<h2>問題がありません</h2><button onclick='home()'>戻る</button>");return}
pool=list.slice();position=0;mode=type;showQuestion();
}
function showQuestion(){
if(position>=pool.length){
screen("<h2>演習終了！</h2><p>お疲れさまでした。</p><button onclick='home()'>メニューへ戻る</button>");
return;
}
currentQuestion=pool[position];selected=-1;
const q=currentQuestion;
const fav=read("rq_favorites").includes(q.id);
let html=`<p class="small">${esc(q.field||"分野未設定")} / ${position+1}問目</p>
<h3>${esc(q.question)}</h3>`;
if(q.image)html+=`<img class="question-image" src="${esc(q.image)}" alt="問題画像">`;
q.choices.forEach((c,i)=>{
html+=`<button class="choice" id="choice${i}" onclick="selectChoice(${i})">${i+1}. ${esc(c)}</button>`;
});
html+=`<button onclick="judge()">回答する</button>
<button class="secondary" onclick="toggleFavorite()">${fav?"★ お気に入り解除":"☆ お気に入り登録"}</button>
<button class="secondary" onclick="home()">メニューへ戻る</button>
<div id="result"></div>`;
screen(html);
}
function selectChoice(i){
selected=i;
currentQuestion.choices.forEach((c,n)=>{
const b=document.getElementById("choice"+n);
if(b)b.classList.toggle("selected",n===i);
});
}
function judge(){
if(selected<0){alert("選択肢を選んでください");return}
const q=currentQuestion;
const correct=selected===Number(q.answer);
let history=read("rq_history");
history.push({id:q.id,correct:correct});
save("rq_history",history);
let mistakes=read("rq_mistakes");
if(correct)mistakes=mistakes.filter(id=>id!==q.id);
else if(!mistakes.includes(q.id))mistakes.push(q.id);
save("rq_mistakes",mistakes);
const result=document.getElementById("result");
result.innerHTML=`<h3>${correct?"正解！":"不正解"}</h3>
<p>正解：${Number(q.answer)+1}. ${esc(q.choices[q.answer])}</p>
<p>${esc(q.explanation||"解説はありません。")}</p>
<button onclick="nextQuestion()">次の問題へ</button>`;
}
function nextQuestion(){position++;showQuestion()}
function toggleFavorite(){
const q=currentQuestion;
let f=read("rq_favorites");
if(f.includes(q.id))f=f.filter(id=>id!==q.id);
else f.push(q.id);
save("rq_favorites",f);
showQuestion();
}
function showYears(){
const years=[...new Set(questions.map(q=>q.year).filter(Boolean))].sort((a,b)=>b-a);
let html="<h2>年度別演習</h2>";
if(!years.length)html+="<p>年度別の問題はまだ収録されていません。</p>";
years.forEach(y=>html+=`<button onclick="showYear(${Number(y)})">${esc(y)}年</button>`);
html+="<button class='secondary' onclick='home()'>戻る</button>";
screen(html);
}
function showYear(y){
startQuizWith(questions.filter(q=>Number(q.year)===Number(y)),"year");
}
function showReview(){
const ids=read("rq_mistakes");
const list=questions.filter(q=>ids.includes(q.id));
if(!list.length){screen("<h2>間違い復習</h2><p>復習する問題はありません。</p><button onclick='home()'>戻る</button>");return}
startQuizWith(list,"review");
}
function showFavorites(){
const ids=read("rq_favorites");
const list=questions.filter(q=>ids.includes(q.id));
if(!list.length){screen("<h2>お気に入り</h2><p>登録した問題はありません。</p><button onclick='home()'>戻る</button>");return}
startQuizWith(list,"favorite");
}
function showStats(){
const h=read("rq_history");
const correct=h.filter(x=>x.correct).length;
const rate=h.length?Math.round(correct/h.length*100):0;
screen(`<h2>学習成績</h2>
<p>回答数：${h.length}問</p>
<p>正解数：${correct}問</p>
<p>正答率：${rate}%</p>
<p>間違い問題：${read("rq_mistakes").length}問</p>
<button onclick="home()">戻る</button>`);
}
home();
</script>
<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
});
}
</script>
</body>
</html>
